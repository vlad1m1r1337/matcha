services:
  db:
    image: postgres:16-alpine
    container_name: matcha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: matcha_test
      POSTGRES_USER: matcha
      POSTGRES_PASSWORD: matcha_password
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcha -d matcha_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: matcha-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matcha.local
      PGADMIN_DEFAULT_PASSWORD:
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  pgdata:
  pgadmin-data:


